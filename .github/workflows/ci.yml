# Integración continua de MediConecta.
#
# Corre en cada push (a cualquier rama y a los tags v*), en cada pull request a main y a pedido (workflow_dispatch).
# Los trabajos corren en paralelo; cada uno deja su resumen en la página del run y sus reportes como artefactos.
#   - Compilación, pruebas y análisis estático: compila los dos proyectos Maven, corre las pruebas unitarias con
#     cobertura (JaCoCo, con umbrales sobre la capa de negocio y dominio) y, si el repositorio tiene el secreto
#     SONAR_TOKEN, el análisis estático de SonarCloud con su Quality Gate.
#   - Pruebas de mutación (PIT) sobre el paquete de dominio, con umbral.
#   - Estabilidad: la suite unitaria tres veces seguidas, que tiene que dar lo mismo las tres veces.
#   - Secretos: gitleaks sobre todos los commits de todas las ramas.
#   - Dependencias: Trivy; falla si hay vulnerabilidades altas o críticas.
#   - Punta a punta: la aplicación completa en el runner, sin contenedores (WildFly, PostgreSQL y Chrome), con los
#     usuarios de demo creados por la propia aplicación, y todas las suites de pruebas/ (Playwright).
# Las herramientas que no son de GitHub se descargan de su release oficial y se verifican por SHA-256 (o, las que
# vienen de Maven Central, por su checksum).
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explícito: así cada paso corre con -eo pipefail y falla si falla cualquier comando de una tubería

env:
  TZ: America/Argentina/Buenos_Aires  # el mismo huso horario que el servidor

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilación, pruebas y análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SonarCloud usa la historia para distinguir el código nuevo
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y correr las pruebas unitarias con cobertura
        run: |
          # Hasta 3 intentos sólo si falló una descarga de Maven Central (429); una prueba que falla no se reintenta.
          for intento in 1 2 3; do
            codigo=0
            mvn -B -ntp verify | tee maven.log || codigo=$?
            if [ "$codigo" = 0 ] || ! grep -q "Could not transfer\|could not be resolved\|Too Many Requests" maven.log; then exit "$codigo"; fi
            echo "::warning::Maven Central no entregó una dependencia (intento $intento); se reintenta"
            sleep $((30 * intento))
          done
          exit 1
      - name: Compilar los sistemas externos simulados
        run: mvn -B -ntp -f sistemas-externos/pom.xml verify
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 .github/scripts/resumen_cobertura.py >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Análisis estático y Quality Gate (SonarCloud)
        if: env.SONAR_TOKEN != ''
        run: mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.qualitygate.wait=true
      - name: Aviso si falta configurar SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::El análisis de SonarCloud no corrió porque el repositorio no tiene el secreto SONAR_TOKEN."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reportes-pruebas
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: ignore

  mutacion:
    name: Pruebas de mutación del dominio (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Correr PIT sobre el paquete de dominio
        # Si falla (una prueba que no pasa sin mutaciones, o el puntaje bajo el umbral), las líneas que lo explican quedan
        # como anotaciones del run: se ven sin abrir el log.
        run: |
          fallo=0
          # Hasta 3 intentos sólo si falló la descarga del plugin (Maven Central puede responder 429).
          for intento in 1 2 3; do
            fallo=0
            mvn -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage > pit.log 2>&1 || fallo=1
            if [ "$fallo" = 0 ] || ! grep -q "could not be resolved\|Too Many Requests" pit.log; then break; fi
            echo "::warning::Maven Central no entregó el plugin de PIT (intento $intento); se reintenta"
            sleep $((30 * intento))
          done
          cat pit.log
          if [ "$fallo" = 1 ]; then
            { grep -E 'ERROR|FAIL|did not pass|mutation score|threshold|Exception' pit.log || true; } | head -15 | while read -r linea; do
              echo "::error title=PIT::$linea"
            done
          fi
          exit "$fallo"
      - name: Resumen de mutación
        if: always()
        run: |
          if [ -f target/pit-reports/mutations.xml ]; then
            python3 .github/scripts/resumen_mutacion.py >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=PIT::$(python3 .github/scripts/resumen_mutacion.py | grep -m1 'Puntaje')"
          else
            echo "::error title=PIT::PIT no dejó el reporte de mutaciones"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-mutacion
          path: target/pit-reports/
          if-no-files-found: ignore

  estabilidad:
    name: Estabilidad de la suite (tres corridas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Correr la suite unitaria tres veces seguidas
        # Cada prueba que falla y cada diferencia entre corridas queda como anotación del run: se ve sin abrir el log.
        run: |
          mvn -B -ntp -q test-compile
          fallo=0
          for corrida in 1 2 3; do
            echo "::group::Corrida $corrida"
            mvn -B -ntp test || fallo=1
            echo "::endgroup::"
            python3 .github/scripts/resultado_suite.py > "corrida-$corrida.txt"
            echo "Corrida $corrida: $(head -1 corrida-$corrida.txt)"
            tail -n +2 "corrida-$corrida.txt" | { grep -v '^ok ' || true; } | while read -r estado prueba; do
              echo "::error title=Corrida $corrida: $estado::$prueba"
            done
          done
          for corrida in 2 3; do
            if ! cmp -s corrida-1.txt "corrida-$corrida.txt"; then
              fallo=1
              diff corrida-1.txt "corrida-$corrida.txt" | head -20 | while read -r linea; do
                echo "::error title=La corrida $corrida no dio lo mismo que la 1::$linea"
              done
            fi
          done
          { echo "## Estabilidad de la suite unitaria"; echo
            if [ "$fallo" = 0 ]; then
              echo "Tres corridas seguidas con el mismo resultado, prueba por prueba: $(head -1 corrida-1.txt)."
            else
              echo "**Las tres corridas no dieron lo mismo o alguna prueba falló** (ver las anotaciones)."
              for corrida in 1 2 3; do echo "- Corrida $corrida: $(head -1 corrida-$corrida.txt)"; done
            fi; } >> "$GITHUB_STEP_SUMMARY"
          exit "$fallo"

  secretos:
    name: Secretos en todo el historial (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # todos los commits de todas las ramas
      - name: Instalar gitleaks 8.30.1
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Escanear todos los commits
        # --redact: si encuentra algo, el log muestra dónde está pero nunca el valor.
        run: ./gitleaks git --redact --verbose --log-opts="--all" --report-format json --report-path gitleaks.json .
      - name: Resumen de secretos
        if: always()
        run: python3 .github/scripts/resumen_secretos.py "$(git rev-list --all --count)"

  dependencias:
    name: Dependencias con vulnerabilidades conocidas (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Instalar Trivy 0.76.1
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: Escanear las dependencias de los dos proyectos Maven
        id: escaneo
        run: ./trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table . | tee trivy.txt
      - name: Resumen de dependencias
        if: always()
        env:
          RESULTADO: ${{ steps.escaneo.outcome }}
        run: |
          { echo "## Dependencias con vulnerabilidades altas o críticas (Trivy 0.76.1)"; echo
            if [ "$RESULTADO" = "success" ]; then
              echo "Sin vulnerabilidades altas ni críticas en las dependencias de los dos proyectos."; echo
            else
              echo "**El escaneo falló:** vulnerabilidades altas o críticas, o un error de Trivy (ver el detalle)."; echo
            fi
            if [ -s trivy.txt ]; then echo '```'; cat trivy.txt; echo '```'; fi; } >> "$GITHUB_STEP_SUMMARY"
          # Lo encontrado (o el error de Trivy), también en una anotación: se ve sin abrir el resumen del run.
          if [ "$RESULTADO" != "success" ]; then
            hallazgos=$({ grep -E 'CVE-|GHSA-|FATAL|ERROR' trivy.txt || true; } | head -15 | cut -c1-220)
            echo "::error title=Trivy::$(echo "${hallazgos:-sin detalle en la salida}" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi

  dependency-check:
    # OWASP Dependency-Check, prometido en el documento de diseño: complementa a Trivy con la base de la NVD y falla
    # si una dependencia del WAR tiene una CVE de CVSS 7 o más sin una supresión justificada.
    name: Dependencias contra la NVD (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Base de la NVD de la corrida anterior (sólo se descarga lo nuevo)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Analizar las dependencias del WAR
        id: analisis
        run: |
          # Hasta 3 intentos sólo si falló una descarga de Maven Central (429); una CVE encontrada no se reintenta.
          for intento in 1 2 3; do
            codigo=0
            mvn -B -ntp -P dependencias verify -DskipTests | tee dependency-check.log || codigo=$?
            if [ "$codigo" = 0 ] || ! grep -q "Could not transfer\|could not be resolved\|Too Many Requests" dependency-check.log; then exit "$codigo"; fi
            echo "::warning::Maven Central no entregó una dependencia (intento $intento); se reintenta"
            sleep $((30 * intento))
          done
          exit 1
      - name: Resumen de Dependency-Check
        if: always()
        run: python3 .github/scripts/resumen_dependency_check.py
      - name: Reporte de Dependency-Check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: target/dependency-check-report.html
          retention-days: 14

  empaquetar:
    # Los dos WAR se compilan una sola vez y pasan como artefacto a las máquinas de punta a punta: cinco máquinas
    # compilando a la vez hacían que Maven Central respondiera 429 (Too Many Requests).
    name: Empaquetar mediconecta.war y externos.war
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar los dos WAR (sin pruebas; las corre el trabajo de compilación)
        run: |
          for pom in pom.xml sistemas-externos/pom.xml; do
            for intento in 1 2 3; do
              mvn -B -ntp -q -f "$pom" package -DskipTests && break
              [ "$intento" = 3 ] && { echo "::error::No se pudo compilar $pom"; exit 1; }
              echo "::warning::Falló la compilación de $pom (intento $intento, posible 429 de Maven Central); se reintenta"
              sleep $((30 * intento))
            done
          done
          mkdir -p wars && cp target/mediconecta.war sistemas-externos/target/externos.war wars/
      # WildFly y el driver también se bajan una sola vez (caché de Actions o Maven Central, con checksums estrictos)
      # y pasan como artefacto: las máquinas de punta a punta ya no dependen de Maven Central.
      - name: Caché de WildFly y del driver de PostgreSQL
        uses: actions/cache@v4
        with:
          path: descargas
          key: descargas-wildfly-41.0.0.Final-postgresql-42.7.13
      - name: WildFly 41 y el driver de PostgreSQL (Maven Central, checksums estrictos)
        run: |
          for artefacto in org.wildfly:wildfly-dist:41.0.0.Final:zip org.postgresql:postgresql:42.7.13; do
            archivo="descargas/$(echo "$artefacto" | awk -F: '{ print $2 "-" $3 "." ($4 ? $4 : "jar") }')"
            if [ -s "$archivo" ]; then echo "En la caché: $archivo"; continue; fi
            for intento in 1 2 3 4; do
              mvn -B -ntp -C -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
                -Dartifact="$artefacto" -DoutputDirectory=descargas && break
              [ "$intento" = 4 ] && { echo "::error::No se pudo bajar $artefacto de Maven Central"; exit 1; }
              echo "::warning::Falló la descarga de $artefacto (intento $intento); se reintenta"
              sleep $((30 * intento))
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wars
          path: wars/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: descargas
          path: descargas/
          retention-days: 1
          compression-level: 0

  punta-a-punta:
    needs: empaquetar
    # La aplicación completa en el runner, sin contenedores: WildFly del zip oficial (de Maven Central, con su
    # checksum), el PostgreSQL y el Google Chrome que ya trae la imagen de Ubuntu, y los usuarios de demo creados por
    # la propia aplicación. Las contraseñas de la corrida se generan acá, se enmascaran y mueren con el runner.
    # Las suites van en dos grupos parejos que corren en paralelo, cada uno con su propia aplicación levantada: así
    # el pipeline entra en los 15 minutos de los criterios (prueba_hold_vence espera los 5 minutos reales del hold).
    # Las mismas máquinas corren las pruebas no funcionales, cada una con su aplicación: la carga con k6, el escaneo
    # de OWASP ZAP y la accesibilidad con axe-core (sin contenedores, con versiones fijas y checksums).
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Pruebas de punta a punta, grupo 1 de 3 (WildFly, PostgreSQL y Chrome del runner)
            tipo: suites
            # prueba_broker va primero: reinicia el servidor (el broker se cae y vuelve a levantar) y necesita el
            # Circuit Breaker de la obra social cerrado (prueba_entrega4 lo deja abierto un rato).
            suites: prueba_broker prueba_hold_vence prueba_e2e prueba_entrega4 demo_api_jwt_409 prueba_responsive
          # prueba_monitor va al final, después de las suites que generan avisos: su escenario 4 (la carga de a
          # tandas de 10) necesita más de 10 avisos de la profesional.
          - nombre: Pruebas de punta a punta, grupo 2 de 3 (WildFly, PostgreSQL y Chrome del runner)
            tipo: suites
            suites: prueba_permisos_broker prueba_cancelacion prueba_inyeccion prueba_contrato_api prueba_contrato_wsdl prueba_monitor
          # Seguridad y defectos en un grupo propio: con las cinco suites anteriores, el grupo 2 llegaba a 13,4 minutos.
          - nombre: Pruebas de punta a punta, grupo 3 de 3 (WildFly, PostgreSQL y Chrome del runner)
            tipo: suites
            suites: prueba_seguridad prueba_defectos prueba_datos_protegidos
            integracion: true  # y las pruebas de integración con Arquillian (src/it/java), en el mismo servidor
          - nombre: Prueba de carga de la API (k6, 50 usuarios durante 5 minutos)
            tipo: carga
          - nombre: Escaneo de seguridad (OWASP ZAP, pasivo y activo autenticado)
            tipo: zap
          - nombre: Accesibilidad (axe-core a 360, 768 y 1280 px, WCAG 2.2 AA)
            tipo: accesibilidad
    env:
      WILDFLY_HOME: ${{ github.workspace }}/wildfly-41.0.0.Final
      NAVEGADOR: chrome
      PYTHON: ${{ github.workspace }}/.venv/bin/python
      CAPTURAS: ${{ github.workspace }}/resultados-e2e/responsive  # las capturas de prueba_responsive, como artefacto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Contraseñas de la corrida (al azar y enmascaradas)
        run: |
          for nombre in PG_CLAVE JWT_SECRETO MEDICONECTA_ADMIN_PASSWORD MEDICONECTA_ADMIN_NUEVA; do
            valor="Ci.$(openssl rand -hex 20)"
            echo "::add-mask::$valor"
            echo "$nombre=$valor" >> "$GITHUB_ENV"
          done
      - name: Base de datos (el PostgreSQL de la imagen del runner)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE mediconecta LOGIN PASSWORD '$PG_CLAVE'" \
            -c "CREATE DATABASE mediconecta OWNER mediconecta"
      # El zip de WildFly y el driver los baja una sola vez el trabajo de empaquetado (Maven Central respondía 429 con
      # cinco máquinas bajándolos a la vez); el paso siguiente sólo los baja si faltan.
      - name: WildFly y el driver del trabajo de empaquetado
        uses: actions/download-artifact@v7
        with:
          name: descargas
          path: descargas
      - name: WildFly 41 y el driver de PostgreSQL (Maven Central, checksums estrictos)
        run: |
          # Hasta 4 intentos con espera creciente: un corte o un 429 de Maven Central no tiene que tirar el pipeline.
          for artefacto in org.wildfly:wildfly-dist:41.0.0.Final:zip org.postgresql:postgresql:42.7.13; do
            archivo="descargas/$(echo "$artefacto" | awk -F: '{ print $2 "-" $3 "." ($4 ? $4 : "jar") }')"
            if [ -s "$archivo" ]; then echo "En la caché: $archivo"; continue; fi
            for intento in 1 2 3 4; do
              mvn -B -ntp -C -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
                -Dartifact="$artefacto" -DoutputDirectory=descargas && break
              [ "$intento" = 4 ] && { echo "::error::No se pudo bajar $artefacto de Maven Central"; exit 1; }
              echo "::warning::Falló la descarga de $artefacto (intento $intento); se reintenta"
              sleep $((30 * intento))
            done
          done
          unzip -q descargas/wildfly-dist-41.0.0.Final.zip
          modulo="$WILDFLY_HOME/modules/org/postgresql/main"
          mkdir -p "$modulo"
          cp descargas/postgresql-42.7.13.jar "$modulo/postgresql.jar"
          cat > "$modulo/module.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <module xmlns="urn:jboss:module:1.9" name="org.postgresql">
              <resources>
                  <resource-root path="postgresql.jar"/>
              </resources>
              <dependencies>
                  <module name="java.sql"/>
                  <module name="java.logging"/>
                  <module name="java.naming"/>
                  <module name="java.management"/>
                  <module name="java.security.jgss"/>
                  <module name="java.xml"/>
              </dependencies>
          </module>
          XML
      - name: Configurar WildFly (los scripts del repositorio y el datasource local)
        run: |
          "$WILDFLY_HOME/bin/jboss-cli.sh" --file=wildfly/configurar-mensajeria.cli
          "$WILDFLY_HOME/bin/jboss-cli.sh" --file=wildfly/configurar-permisos-broker.cli
          "$WILDFLY_HOME/bin/jboss-cli.sh" --commands="embed-server --server-config=standalone-full.xml,data-source add --name=mediconectaDS --jndi-name=java:/mediconectaDS --driver-name=postgresql --connection-url=jdbc:postgresql://localhost:5432/mediconecta --user-name=mediconecta --password=$PG_CLAVE --enabled=true --jta=true --use-ccm=true --min-pool-size=2 --max-pool-size=20 --validate-on-match=true --background-validation=false,stop-embedded-server"
          # Clave del cifrado de columnas (ADR-0022): nueva en cada corrida, guardada en el credential store de Elytron.
          python3 wildfly/configurar_cifrado.py --generar
      - name: Los WAR del trabajo de empaquetado
        uses: actions/download-artifact@v7
        with:
          name: wars
          path: wars
      - name: Desplegar mediconecta.war y externos.war
        run: cp wars/mediconecta.war wars/externos.war "$WILDFLY_HOME/standalone/deployments/"
      - name: Levantar WildFly (perfil standalone-full)
        run: |
          nohup "$WILDFLY_HOME/bin/standalone.sh" -c standalone-full.xml -Dmediconecta.jwt.secreto="$JWT_SECRETO" \
            > wildfly.out 2>&1 &
          despliegues="$WILDFLY_HOME/standalone/deployments"
          for _ in $(seq 1 120); do
            if ls "$despliegues"/*.failed > /dev/null 2>&1; then
              echo "::error::Falló el despliegue: $(ls "$despliegues"/*.failed)"; tail -50 wildfly.out; exit 1
            fi
            if [ -f "$despliegues/mediconecta.war.deployed" ] && [ -f "$despliegues/externos.war.deployed" ]; then break; fi
            sleep 2
          done
          estado=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/mediconecta/login.xhtml)
          if [ "$estado" != 200 ]; then echo "::error::La aplicación no responde ($estado)"; tail -50 wildfly.out; exit 1; fi
          echo "MediConecta y los sistemas externos desplegados."
      - name: Playwright (usa el Google Chrome del runner)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q playwright==1.65.2
      - name: Usuarios de demo (los crea la propia aplicación)
        run: '"$PYTHON" pruebas/sembrar_usuarios_demo.py'
      - name: Dependencias de las pruebas de integración (al principio, antes de que se crucen las descargas)
        if: matrix.tipo == 'suites' && matrix.integracion
        run: |
          for intento in 1 2 3 4; do
            mvn -B -ntp -q -P integracion test-compile && exit 0
            echo "::warning::No se pudieron bajar las dependencias de integración (intento $intento); se reintenta"
            sleep $((45 * intento))
          done
          exit 1
      - name: Pruebas de punta a punta
        if: matrix.tipo == 'suites'
        run: bash .github/scripts/punta_a_punta.sh ${{ matrix.suites }}
      - name: Pruebas de integración (Arquillian y REST Assured contra el servidor del runner)
        if: matrix.tipo == 'suites' && matrix.integracion
        run: |
          # Se despliegan en el WildFly de este runner (contenedor remoto, autenticación local de administración).
          # Hasta 3 intentos sólo si falló una descarga de Maven Central (429); una prueba que falla no se reintenta.
          for intento in 1 2 3; do
            codigo=0
            mvn -B -ntp -P integracion verify -Djacoco.skip=true -Dtest=NingunaUnitaria               -Dsurefire.failIfNoSpecifiedTests=false | tee integracion.log || codigo=$?
            if [ "$codigo" = 0 ] || ! grep -q "Could not transfer\|could not be resolved\|Too Many Requests" integracion.log; then break; fi
            echo "::warning::Maven Central no entregó una dependencia (intento $intento); se reintenta"
            sleep $((30 * intento))
          done
          {
            echo "### Pruebas de integración (Arquillian y REST Assured)"
            echo
            grep -h "Tests run:.*-- in ar.edu.mediconecta.it" integracion.log | sed 's/^\[[A-Z]*\] /- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$codigo" != 0 ]; then
            # El detalle en una anotación: el log del trabajo pide iniciar sesión en GitHub para leerlo.
            detalle=$({ grep -hE "Tests run:.*FAIL|<<< (FAILURE|ERROR)|AssertionFailed|Exception:|\[ERROR\]" integracion.log || true; } | head -12 | cut -c1-230)
            echo "::error title=Integración::$(echo "${detalle:-sin detalle en la salida}" | sed ':a;N;$!ba;s/%/%25/g;s/
/%0A/g')"
          fi
          exit "$codigo"
      - name: k6 2.3.0 (binario oficial, con su checksum)
        if: matrix.tipo == 'carga'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o k6.tar.gz https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  k6.tar.gz" | sha256sum -c -
          tar -xzf k6.tar.gz
          sudo mv k6-v2.3.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Datos para la carga (horarios publicados y turnos del paciente de demo)
        if: matrix.tipo == 'carga'
        run: '"$PYTHON" pruebas/carga/preparar_datos.py'
      - name: Prueba de carga (p95 menor a 500 ms y menos de 1 % de errores en cada endpoint)
        if: matrix.tipo == 'carga'
        run: |
          mkdir -p resultados-carga resultados-e2e
          codigo=0
          k6 run --quiet pruebas/carga/carga_api.js || codigo=$?
          cat resultados-carga/reporte.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # La tabla también en una anotación, para leerla en la página del run sin bajar el artefacto.
          tabla=$({ grep -E '^[|] GET|^Total' resultados-carga/reporte.md || true; } | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=k6::$tabla"
          cp -r resultados-carga resultados-e2e/carga
          if [ "$codigo" -ne 0 ]; then echo "::error title=k6::no se cumplió algún umbral de la prueba de carga (código $codigo)"; fi
          exit "$codigo"
      - name: OWASP ZAP 2.17.0 (paquete oficial para Linux, con su checksum)
        if: matrix.tipo == 'zap'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o zap.tar.gz https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          echo "efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a  zap.tar.gz" | sha256sum -c -
          tar -xzf zap.tar.gz
      - name: Sesión del paciente de demo para el escaneo autenticado
        if: matrix.tipo == 'zap'
        run: '"$PYTHON" pruebas/seguridad/sesion_zap.py'
      - name: Escaneo OWASP ZAP (0 alertas High)
        if: matrix.tipo == 'zap'
        run: |
          mkdir -p resultados-zap resultados-e2e
          codigo=0
          # ZAP levanta su propio proxy, por defecto en el 8080, que es el de WildFly: se lo pasa al 8090.
          ZAP_2.17.0/zap.sh -cmd -host 127.0.0.1 -port 8090 -autorun "$GITHUB_WORKSPACE/pruebas/seguridad/zap-plan.yaml" > zap.log 2>&1 || codigo=$?
          tail -60 zap.log
          if [ ! -s resultados-zap/zap-reporte.json ]; then
            # Sin reporte: el final de la salida de ZAP en una anotación, para verlo sin abrir el log.
            final=$({ grep -v '^[[:space:]]*$' zap.log | tail -25 | cut -c1-250; } || true)
            echo "::error title=ZAP (código $codigo)::$(echo "$final" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          python3 .github/scripts/resumen_zap.py || codigo=1
          cp -r resultados-zap resultados-e2e/zap
          cp zap.log resultados-e2e/zap/ 2>/dev/null || true
          exit "$codigo"
      - name: axe-core 4.14.0 (paquete del registro de npm, con su sha512 publicado; sin npm ni scripts)
        if: matrix.tipo == 'accesibilidad'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o axe.tgz https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz
          esperado="9WTZxEjsZ7b13TH8JPmbV2z8CHbl80/2hm3XPEG4JgNdQLK81IBRXmSxHfMAOkSqQeRxT/0dwNDz2GOm3zzpcQ=="
          obtenido=$(openssl dgst -sha512 -binary axe.tgz | base64 -w0)
          if [ "$obtenido" != "$esperado" ]; then echo "::error::axe-core no coincide con su integridad publicada"; exit 1; fi
          mkdir -p .herramientas && tar -xzf axe.tgz -C .herramientas package/axe.min.js
      - name: Accesibilidad (axe a 360, 768 y 1280 px)
        if: matrix.tipo == 'accesibilidad'
        env:
          AXE_JS: ${{ github.workspace }}/.herramientas/package/axe.min.js
          RESULTADOS_ACCESIBILIDAD: ${{ github.workspace }}/resultados-e2e/accesibilidad
        run: bash .github/scripts/punta_a_punta.sh prueba_accesibilidad
      - name: Log del servidor
        if: always()
        run: |
          mkdir -p resultados-e2e
          cp "$WILDFLY_HOME/standalone/log/server.log" resultados-e2e/ 2>/dev/null || cp wildfly.out resultados-e2e/ 2>/dev/null || true
      - name: Errores del servidor (si algo falló)
        if: failure()
        run: |
          # Los errores del server.log, en una sola anotación: se ven sin descargar el artefacto.
          log=resultados-e2e/server.log
          [ -f "$log" ] || log=resultados-e2e/wildfly.out
          errores=$({ grep -E " ERROR |Caused by|Exception:" "$log" | grep -v "ELYEE01007" | cut -c1-300 | head -25; } || true)
          if [ -n "$errores" ]; then
            echo "::error title=server.log::$(echo "$errores" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          else
            echo "::notice title=server.log::sin errores en el log del servidor"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-punta-a-punta-${{ strategy.job-index }}
          path: resultados-e2e/
          if-no-files-found: ignore
