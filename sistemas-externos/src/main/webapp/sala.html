<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de videoconsulta</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0b1120; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 22px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .chip { padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; background:#052e1a; color:#22c55e; }
  .chip.cerrada { background:#3b0a0a; color:#ef4444; }
  main { flex:1; display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; padding:18px 22px; }
  .video { position:relative; background:#111827; border:1px solid #1f2937; border-radius:14px; min-height:260px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .video video { width:100%; height:100%; object-fit:cover; }
  .avatar { width:84px; height:84px; border-radius:50%; background:#1e3a8a; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; }
  .nombre { position:absolute; left:12px; bottom:10px; background:rgba(0,0,0,.55); padding:4px 10px; border-radius:8px; font-size:12.5px; }
  footer { padding:14px 22px; border-top:1px solid #1e293b; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button { border:0; border-radius:22px; padding:10px 18px; font-weight:700; cursor:pointer; background:#1f2937; color:#e2e8f0; }
  button.colgar { background:#dc2626; }
  button.activa { background:#e2e8f0; color:#0b1120; }
  .indicador { position:absolute; right:12px; bottom:10px; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.55); padding:4px 10px; border-radius:8px; font-size:12px; }
  .nivel { width:44px; height:6px; border-radius:3px; background:#334155; overflow:hidden; }
  .nivel span { display:block; height:100%; width:0; background:#22c55e; transition:width .08s linear; }
  .aviso { text-align:center; padding:14px 22px; font-size:14px; color:#fca5a5; }
  button:disabled { opacity:.45; cursor:default; }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Sala de videoconsulta</h1>
  <span id="estado" class="chip">…</span>
</header>
<main>
  <div class="video" id="local"><div class="avatar" id="avatarLocal">?</div><span class="nombre" id="nombreLocal">Vos</span>
    <span class="indicador" id="indicadorMicrofono" hidden><span id="textoMicrofono">Micrófono activado</span><span class="nivel"><span id="nivel"></span></span></span></div>
  <div class="video"><div class="avatar" id="avatarRemoto">?</div><span class="nombre" id="nombreRemoto">Esperando al otro participante…</span></div>
</main>
<footer>
  <button id="camara">Activar cámara</button>
  <button id="microfono">Activar micrófono</button>
  <button class="colgar" id="salir">Salir</button>
</footer>
<div class="aviso" id="finalizada" hidden>El profesional finalizó la consulta. Ya podés cerrar esta ventana.</div>
<script>
  const params = new URLSearchParams(location.search);
  const rol = params.get('rol') === 'profesional' ? 'profesional' : 'paciente';
  const inicial = s => (s || '?').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
  fetch('api/video/v1/salas/' + encodeURIComponent(params.get('id'))).then(r => r.json()).then(sala => {
    document.getElementById('titulo').textContent = sala.titulo || 'Sala de videoconsulta';
    const estado = document.getElementById('estado');
    estado.textContent = sala.estado === 'ABIERTA' ? 'En curso' : 'Consulta finalizada';
    estado.classList.toggle('cerrada', sala.estado !== 'ABIERTA');
    if (sala.estado !== 'ABIERTA') { setTimeout(terminar, 0); }
    const yo = rol === 'profesional' ? sala.profesional : sala.paciente;
    const otro = rol === 'profesional' ? sala.paciente : sala.profesional;
    document.getElementById('nombreLocal').textContent = (yo || 'Vos') + ' (vos)';
    avatarLocal.textContent = inicial(yo);   // aunque la cámara ya esté encendida y el avatar no esté en pantalla
    document.getElementById('nombreRemoto').textContent = otro || 'Participante';
    document.getElementById('avatarRemoto').textContent = inicial(otro);
  }).catch(() => { document.getElementById('estado').textContent = 'Sala inexistente'; });
  // Cámara: el mismo botón la activa y la desactiva (paciente y profesional usan esta misma sala).
  // Al desactivarla se detienen las pistas del stream, así el navegador apaga la luz de la cámara.
  const botonCamara = document.getElementById('camara');
  const avatarLocal = document.getElementById('avatarLocal');
  let stream = null;
  let ocupado = false;

  function apagarCamara() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const video = document.querySelector('#local video');
    if (video) { video.srcObject = null; video.replaceWith(avatarLocal); }
    botonCamara.textContent = 'Activar cámara';
    botonCamara.classList.remove('activa');
    botonCamara.setAttribute('aria-pressed', 'false');
  }

  async function encenderCamara() {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    const v = document.createElement('video'); v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = stream;
    avatarLocal.replaceWith(v);
    botonCamara.textContent = 'Desactivar cámara';
    botonCamara.classList.add('activa');
    botonCamara.setAttribute('aria-pressed', 'true');
  }

  botonCamara.setAttribute('aria-pressed', 'false');
  botonCamara.addEventListener('click', async () => {
    if (ocupado) return;           // evita dobles clics mientras el navegador pide permiso
    ocupado = true;
    try {
      if (stream) { apagarCamara(); } else { await encenderCamara(); }
    } catch (e) {
      apagarCamara();
      botonCamara.textContent = 'Cámara no disponible · reintentar';
    } finally { ocupado = false; }
  });
  // Micrófono: el primer clic pide permiso y lo activa; después el mismo botón lo silencia y le devuelve el sonido
  // (se deshabilita la pista, sin volver a pedir permiso). El medidor muestra que el micrófono capta sonido.
  const botonMicrofono = document.getElementById('microfono');
  const indicador = document.getElementById('indicadorMicrofono');
  const textoMicrofono = document.getElementById('textoMicrofono');
  const nivel = document.getElementById('nivel');
  let audio = null, contexto = null, medidor = null;

  function mostrarMicrofono() {
    const activo = audio && audio.getAudioTracks()[0].enabled;
    botonMicrofono.textContent = activo ? 'Silenciar micrófono' : 'Activar micrófono';
    botonMicrofono.classList.toggle('activa', !!activo);
    botonMicrofono.setAttribute('aria-pressed', activo ? 'true' : 'false');
    indicador.hidden = !audio;
    textoMicrofono.textContent = activo ? 'Micrófono activado' : 'Micrófono silenciado';
    if (!activo) { nivel.style.width = '0'; }
  }

  function medir(analizador) {
    const datos = new Uint8Array(analizador.fftSize);
    medidor = setInterval(() => {
      if (!audio || !audio.getAudioTracks()[0].enabled) { return; }
      analizador.getByteTimeDomainData(datos);
      const pico = datos.reduce((max, v) => Math.max(max, Math.abs(v - 128)), 0);
      nivel.style.width = Math.min(100, pico * 2) + '%';
    }, 100);
  }

  async function encenderMicrofono() {
    audio = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    try {
      contexto = new AudioContext();
      const analizador = contexto.createAnalyser();
      contexto.createMediaStreamSource(audio).connect(analizador);
      medir(analizador);
    } catch (e) { /* sin medidor: el micrófono funciona igual */ }
  }

  function apagarMicrofono() {
    if (medidor) { clearInterval(medidor); medidor = null; }
    if (contexto) { contexto.close(); contexto = null; }
    if (audio) { audio.getTracks().forEach(t => t.stop()); audio = null; }
    mostrarMicrofono();
  }

  botonMicrofono.setAttribute('aria-pressed', 'false');
  botonMicrofono.addEventListener('click', async () => {
    if (ocupado) return;
    ocupado = true;
    try {
      if (!audio) { await encenderMicrofono(); }
      else { const pista = audio.getAudioTracks()[0]; pista.enabled = !pista.enabled; }
      mostrarMicrofono();
    } catch (e) {
      apagarMicrofono();
      botonMicrofono.textContent = 'Micrófono no disponible · reintentar';
    } finally { ocupado = false; }
  });

  // Cuando el profesional finaliza la consulta (MediConecta cierra la sala en el proveedor), la sala se apaga sola.
  const consultaEstado = setInterval(() => {
    fetch('api/video/v1/salas/' + encodeURIComponent(params.get('id'))).then(r => r.json()).then(sala => {
      if (sala.estado !== 'ABIERTA') { terminar(); }
    }).catch(() => {});
  }, 5000);

  function terminar() {
    clearInterval(consultaEstado);
    apagarCamara();
    apagarMicrofono();
    const estado = document.getElementById('estado');
    estado.textContent = 'Consulta finalizada';
    estado.classList.add('cerrada');
    botonCamara.disabled = true;
    botonMicrofono.disabled = true;
    document.getElementById('finalizada').hidden = false;
  }

  window.addEventListener('pagehide', () => { apagarCamara(); apagarMicrofono(); });
  document.getElementById('salir').addEventListener('click', () => { apagarCamara(); apagarMicrofono(); window.close(); });
</script>
</body>
</html>
