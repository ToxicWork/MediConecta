<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <!-- Selector de tema visual: tema.js lo cambia en vivo, sin recargar la página. -->
    <div class="tema-switch" role="group" aria-label="Tema visual">
        <button type="button" data-tema-opcion="estandar" title="Tema estándar de MediConecta"
                class="#{temaBean.actual == 'estandar' ? 'activo' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.5-2.8-8-6.2-8-10.2A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 8 4.8c0 4-3.5 7.4-8 10.2Z"/></svg>
            <span>Estándar</span>
        </button>
        <button type="button" data-tema-opcion="claro" title="Tema claro"
                class="#{temaBean.actual == 'claro' ? 'activo' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span>Claro</span>
        </button>
        <button type="button" data-tema-opcion="oscuro" title="Tema oscuro"
                class="#{temaBean.actual == 'oscuro' ? 'activo' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            <span>Oscuro</span>
        </button>
    </div>
</ui:composition>
