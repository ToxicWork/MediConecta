<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/acceso.xhtml">

    <ui:param name="pageTitle" value="Ingreso"/>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{loginBean.redirigirSiYaInicioSesion}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <h2>Iniciar sesión</h2>
        <p class="page-subtitle">Ingresá con tu email y contraseña.</p>

        <h:form id="formLogin">
            <div class="field">
                <label for="formLogin:email">Email</label>
                <p:inputText id="email" value="#{loginBean.email}" autocomplete="username"/>
            </div>
            <div class="field">
                <label for="formLogin:password">Contraseña</label>
                <p:password id="password" value="#{loginBean.password}" feedback="false" autocomplete="current-password"/>
            </div>
            <p:commandButton value="Ingresar" action="#{loginBean.login}" ajax="false" styleClass="btn btn-primary btn-block"/>
        </h:form>

        <p class="auth-alternativa">
            ¿No tenés cuenta?&#160;<h:link id="linkRegistro" outcome="/registro.xhtml" value="Registrate"/>
        </p>
    </ui:define>
</ui:composition>
